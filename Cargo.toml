[workspace]
resolver = "2"
members = [
    "crates/fastcull-core",
    "crates/fastcull-cli",
    "crates/fastcull-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/danilocesar/fastcull"

[workspace.dependencies]
fastcull-core = { path = "crates/fastcull-core" }

[profile.release]
opt-level = 3
lto = "thin"
