[package]
name = "fastcull-core"
description = "Culling engine: RAW preview pipeline, XMP sidecars, IPTC, burst grouping, file ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fast_image_resize = "5"
jpeg-encoder = "0.6"
rawler = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zune-jpeg = "0.4"
