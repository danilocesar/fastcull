[package]
name = "fastcull-core"
description = "Culling engine: RAW preview pipeline, XMP sidecars, IPTC, burst grouping, file ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = "6"
fast_image_resize = "5"
jpeg-encoder = "0.6"
quick-xml = "0.37"
rawler = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# IPTC templates (iptc-templates.md): templates.toml parsing, and Unicode
# casefolding for the keyword dedup rule ("first spelling wins").
toml = "0.8"
caseless = "0.2"
# Panel input sanitization (iptc-templates.md): NFC normalization before
# the casefolded keyword dedup, and control-character stripping (QE: exiv2
# rejects XMP packets containing raw control chars).
unicode-normalization = "0.1"
# Copy-picks engine (fileops.md): streaming checksums promoted to v1 (the
# copy IS the working copy before a card format), and free-space checks.
blake3 = "1"
fs2 = "0.4"
# The grid-thumb decoder (`pipeline::make_grid_thumb`; the app's thumb cook
# declares its own). The loupe left it for libjpeg-turbo below and the
# thumbs stay on it (raw-pipeline.md, "The decoder", N7), except for one
# loupe route, `loupe::decode_through_zune`: a CMYK or YCCK stream, which
# libjpeg-turbo will not convert to RGB (brief 008 R14; canary 8 below), and
# zune-jpeg's second opinion on a stream libjpeg-turbo refuses over a
# complaint outside the damage and kept classes (raw-pipeline.md, "The
# decoder's complaints"; canaries 9-13 below).
# VERSION-BUMP CANARY (read in the sources 2026-09-26): zune-core 0.4.12's
# `DecoderOptions::default()` sets `max_scans: 100` (`src/options/
# decoder.rs` 651) and zune-jpeg 0.4.21 fails a progressive stream past it
# ("Too many scans", `src/mcu_prog.rs` 148-151). The grid thumb and the
# loupe's zune-jpeg route build their options from `default()`, so that
# default is their only progressive-scan bound, and the loupe copies the
# number into libjpeg-turbo (canary 6 below). A bump that changes the
# default changes the bound silently (raw-pipeline.md, "Progressive scans:
# at most 100"). Also read there and pinned by the other-cameras tests:
# `default()` is STRICT (`decoder_strict_mode`, `src/options/decoder.rs`
# 646-653), and strict zune-jpeg 0.4.21 refuses two or more bytes between
# header segments ("[strict-mode]: Extra bytes between headers",
# `src/decoder.rs` 404-412) -- why the loupe and the grid thumb drop header
# gaps before it decodes (`raw::without_header_gaps`); it refuses an Adobe
# transform outside 0-2 in either mode ("Unknown Adobe colorspace",
# `src/headers.rs` 466-476, no strict check); and it resets at any restart
# marker whatever its number (`src/mcu.rs` 468-471, 503-510), so it decodes
# a renumbered RST that libjpeg-turbo refuses as damage.
zune-jpeg = "0.4"
# libjpeg-turbo, the loupe's decoder and the source of its N/8 screen rung
# (ADR 0005, brief 008, 2026-09-26). All three features spelled out so a
# default change upstream is visible here: `cmake` builds the vendored
# 3.1.0 from source, `pkg-config` lets TURBOJPEG_SOURCE=pkg-config link a
# system >= 3.0 on Linux (README), `require-simd` makes a seat without
# NASM FAIL the build instead of shipping a 1.95x slower decoder.
# VERSION-BUMP CANARY (re-read before raising this bound; every line was
# read in the vendored sources or measured, 2026-09-26):
#   1. `tj3Decompress8` returns -1 whenever ANY warning was emitted during
#      the decode, flag or no flag (`src/turbojpeg-mp.c`, the `bailout:`
#      label: `if (this->jerr.warning) retval = -1`), and the safe crate
#      maps every non-zero return to `Err` (`turbojpeg-1.5.1/src/
#      decompress.rs`, `decompress`). This is the ONLY guard for the
#      residual-gap stream (plausible dims, valid EOI, too little entropy
#      data): the memory source inserts a fake EOI and warns
#      `JWRN_JPEG_EOF` ("Premature end of JPEG file", `jdatasrc.c`), the
#      Huffman decoder warns `JWRN_HIT_MARKER` ("Corrupt JPEG data:
#      premature end of data segment", `jdhuff.c`) and feeds zero bits.
#      `a_short_scan_with_a_valid_eoi_fails_on_the_loupe_path` pins it.
#   2. `tj3DecompressHeader` parses markers and allocates NO image buffer,
#      so `MAX_DECODED_PIXELS` is checked on its answer before anything is
#      sized from a hostile claim. `TJPARAM_MAXPIXELS` and
#      `TJPARAM_STOPONWARNING` are NOT set: the safe crate keeps its
#      handle private (`mod handle` is not pub) and taking them means the
#      core crate's first `unsafe` block, for an abort 13-24 ms earlier.
#   3. The reduced-size IDCTs have SIMD only at 4x4 and 2x2
#      (`simd/x86_64/jsimd.c`, `jsimd_can_idct_4x4`/`_2x2`): the 3/8 rung
#      runs a C 3x3 IDCT and still measured 4 % faster than 1/2.
#   4. A LOSSLESS stream cannot be DCT-scaled: `Decompressor::decompress`
#      returns `Error::CannotScaleLossless` when the header says
#      `is_lossless` and the factor is not 1/1 (`decompress.rs`,
#      `check_output_size`), so `decode_scaled_oriented` decodes such a
#      stream at full scale and the ladder sees a Full, never a Screen.
#   5. The `cmake` crate (0.1.58, `src/lib.rs` `get_profile`) builds the C
#      library at the CMake profile cargo's opt-level implies: opt-level 0
#      -> Debug, 1-3 with debug info -> RelWithDebInfo, without -> Release.
#      The workspace's `[profile.dev.package."*"] opt-level = 2` (#76) makes
#      the debug build RelWithDebInfo; remove it and the debug decoder is a
#      Debug build, unoptimised. A profile's own flags are optimised only
#      where CMake's defaults apply: on Linux, and on MSVC only because the
#      generator is named (item 7). (Corrected 2026-09-26, senior-developer
#      review F1: this said the #76 line alone kept the decode optimised,
#      which was false on MSVC.)
#   6. `TJPARAM_SCANLIMIT` defaults to 0, no limit (`src/turbojpeg.h`:
#      "[default: `0` (no limit)]"; `tj3Init` zeroes the instance), and
#      `tj3Decompress8` installs its progress monitor, which fails a decode
#      past the limit with "Progressive JPEG image has more than N scans"
#      (`src/turbojpeg.c`), only when a limit is set (`src/turbojpeg-mp.c`,
#      `if (this->scanLimit)`). The loupe sets 100 through the safe crate's
#      `Decompressor::set_scan_limit`: zune-jpeg 0.4's own default (see
#      zune-jpeg above), the bound the loupe had before the swap.
#      `a_progressive_stream_over_100_scans_fails_on_the_loupe_path` pins it.
#   7. The `cmake` crate (0.1.58) on the MSVC target. With no generator
#      named it picks the Visual Studio generator it finds (`src/lib.rs`
#      652) and sets CMAKE_C_FLAGS_<BUILD_TYPE> -- the flags of the
#      configuration it builds -- to the `cc` crate's with every `-O`/`/O`
#      flag stripped (`skip_arg`, `generator.is_none() && msvc`, 723-768),
#      replacing CMake's `/O2 /Ob2 /DNDEBUG`, so MSVC compiles libjpeg-turbo
#      unoptimised in every profile (brief 008's first Windows artifact: its
#      3/8 rung decoded slower than the full frame). Any named generator
#      skips that override. The workspace `.cargo/config.toml` names Ninja
#      as `CMAKE_GENERATOR_x86_64_pc_windows_msvc`; the crate reads
#      `CMAKE_GENERATOR_<target>` with the target's dashes, then with
#      underscores, then `HOST_`/`TARGET_CMAKE_GENERATOR`, then a plain
#      `CMAKE_GENERATOR` (947-960), after the builder's own `.generator()`,
#      which turbojpeg-sys does not call (510-513). With Ninja on MSVC it
#      passes cc's `cl.exe` as CMAKE_C_COMPILER (780-806) and runs the
#      configure and the build in cc's MSVC environment (822-823, 837-838):
#      PATH with the compiler's and the Windows SDK's tool directories in
#      front, INCLUDE and LIB (find-msvc-tools 0.1.9, `src/find_tools.rs`,
#      `tool_from_vs15plus_instance` and `add_env`), no ninja among the
#      added directories, so a seat brings `ninja` on its own PATH. Neither
#      crate declares the name a rerun trigger (turbojpeg-sys's are
#      `build.rs`, `bindings.rs` and `TURBOJPEG_*`; the `cmake` crate
#      prints none), so a changed name rebuilds nothing already built until
#      `cargo clean -p turbojpeg-sys`. libjpeg-turbo itself links the static
#      C runtime on MSVC by default (`WITH_CRT_DLL` off, `CMakeLists.txt`
#      400-427: CMAKE_MSVC_RUNTIME_LIBRARY MultiThreaded), the runtime the
#      artifact's `crt-static` build links. ci.yml's "Verify Windows
#      artifact" reads each build's CMake cache for /O2 and prints the
#      generator it used. The `cmake` crate arrives through turbojpeg-sys:
#      re-read both on a bump of either.
#   8. `tj3Decompress8` refuses CMYK and YCCK for RGB output: libjpeg's
#      colour deconverter has no CMYK/YCCK -> RGB path and fails with
#      JERR_CONVERSION_NOTIMPL, "Unsupported color conversion request"
#      (`src/jdcolor.c`, `_jinit_color_deconverter`; measured 2026-09-26,
#      brief 008 step 1's probe), although `tj3DecompressHeader` reads
#      such a stream and reports TJCS_CMYK / TJCS_YCCK. So `decode_with`
#      routes those streams to zune-jpeg 0.4, which converts both (brief
#      008 R14): `cmyk_and_ycck_streams_decode_on_the_loupe_path` pins it.
#   9. The safe crate reports a complaint as TEXT only,
#      `Error::TurboJpegError(String)` (`turbojpeg-1.5.1/src/common.rs`),
#      the message `tj3GetErrorStr` returns: libjpeg's FIRST warning of the
#      datastream (`src/jerror.c` `emit_message` outputs one only while
#      `num_warnings == 0`, which `reset_error_mgr` zeroes for each
#      datastream from `src/jdinput.c` `reset_input_controller`), replaced
#      by a fatal error's text (`src/turbojpeg.c` `my_error_exit` ->
#      `output_message`). The loupe sorts complaints into the damage, kept
#      and second-opinion classes by those texts, as `src/jerror.h` words
#      them (raw-pipeline.md, "The decoder's complaints"):
#      `libjpeg_turbo_messages_sort_into_three_classes` pins the table, and
#      the harmless and damage tests decode a real stream of each class, so
#      a version that rewords one turns its row red.
#  10. `tj3Decompress8` reads every scanline and runs
#      `jpeg_finish_decompress` BEFORE its `bailout:` turns a warning into
#      -1 (`src/turbojpeg-mp.c` 280-285), so the buffer behind a kept
#      warning is complete, and the loupe uses it as decoded.
#  11. `tj3DecompressHeader` returns -1 when the header read warned
#      (`src/turbojpeg.c`, its `bailout:`), `Decompressor::decompress` reads
#      the header first (`check_output_size`), and a decompressor saves
#      APP2 markers by default (`saveMarkers = 2` in `tj3Init`), so a bad
#      ICC chunk is a header complaint: no header is left to decode from,
#      and the loupe asks zune-jpeg's second opinion.
#  12. At a scan's end the Huffman decoder drops, uncounted, the bytes its
#      bit buffer read ahead -- `start_pass_huff_decoder` resets
#      `bits_left` (`src/jdhuff.c` 125-126) -- while `process_restart`
#      adds them to `discarded_bytes` (517-520): a few junk bytes before EOI
#      raise no message (1-7 on the tests' 1024x768 fixture), and every
#      byte before a restart marker is counted.
#  13. The arithmetic decoder supplies zeros at a marker in the data
#      without a warning (`src/jdarith.c` 136-140), the bounded blank
#      success raw-pipeline.md records for arithmetic-coded streams.
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "pkg-config", "require-simd"] }
# The loupe's decoder count follows the PHYSICAL cores (`budget.rs`;
# raw-pipeline.md, "The decode workers"): `num_cpus::get_physical` reads
# Linux's `/proc/cpuinfo`, summing `cpu cores` per `physical id`, and
# Windows' `GetLogicalProcessorInformation`, counting its
# `RelationProcessorCore` entries, and falls back to the logical count when
# the topology is unreadable, so it never answers 0 (num_cpus 1.17.0,
# `src/linux.rs` `get_num_physical_cpus`, `src/lib.rs`
# `get_num_physical_cpus_windows`; read 2026-09-27). std offers only the
# logical count (`available_parallelism`), which counts hyperthreads — on
# this serial, Huffman-bound decode a hyperthread doubles the per-frame
# latency for 5-9 % more throughput (brief 008's benchmark).
num_cpus = "1"

# Total RAM on Windows, for the pixel cache (`budget.rs`): core's ONE
# `unsafe` block, `GlobalMemoryStatusEx` (Manager ruling 2026-09-26, brief
# 008 Q1). windows-sys 0.61.2 is already in the lock through the app; this
# adds a feature, not a crate. `MEMORYSTATUSEX` derives `Default` there
# (`src/Windows/Win32/System/SystemInformation/mod.rs`), which the probe's
# zeroed struct relies on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
criterion = "0.5"
zune-jpeg = "0.4"

[[bench]]
name = "hot_path"
harness = false
