[package]
name = "fastcull-core"
description = "Culling engine: RAW preview pipeline, XMP sidecars, IPTC, burst grouping, file ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = "6"
fast_image_resize = "5"
jpeg-encoder = "0.6"
quick-xml = "0.37"
rawler = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# IPTC templates (iptc-templates.md): templates.toml parsing, and Unicode
# casefolding for the keyword dedup rule ("first spelling wins").
toml = "0.8"
caseless = "0.2"
# Panel input sanitization (iptc-templates.md): NFC normalization before
# the casefolded keyword dedup, and control-character stripping (QE: exiv2
# rejects XMP packets containing raw control chars).
unicode-normalization = "0.1"
zune-jpeg = "0.4"

[dev-dependencies]
criterion = "0.5"
zune-jpeg = "0.4"

[[bench]]
name = "hot_path"
harness = false
