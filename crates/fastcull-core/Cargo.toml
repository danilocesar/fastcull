[package]
name = "fastcull-core"
description = "Culling engine: RAW preview pipeline, XMP sidecars, IPTC, burst grouping, file ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = "6"
fast_image_resize = "5"
jpeg-encoder = "0.6"
quick-xml = "0.37"
rawler = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# IPTC templates (iptc-templates.md): templates.toml parsing, and Unicode
# casefolding for the keyword dedup rule ("first spelling wins").
toml = "0.8"
caseless = "0.2"
# Panel input sanitization (iptc-templates.md): NFC normalization before
# the casefolded keyword dedup, and control-character stripping (QE: exiv2
# rejects XMP packets containing raw control chars).
unicode-normalization = "0.1"
# Copy-picks engine (fileops.md): streaming checksums promoted to v1 (the
# copy IS the working copy before a card format), and free-space checks.
blake3 = "1"
fs2 = "0.4"
zune-jpeg = "0.4"
# The settings file (settings.md, ADR 0005): a read-modify-write that keeps
# the user's comments and unknown keys, which `toml`'s serde round trip
# cannot. Already in the tree under `toml` 0.8 (same version, same
# licence), so this adds a dependency edge, not a crate.
toml_edit = "0.22"

# Total RAM on Windows, for the loupe memory setting's percentage
# (`settings::total_ram`): core's ONE `unsafe` block, `GlobalMemoryStatusEx`
# (Manager ruling 2026-09-26). windows-sys 0.61 is already in the lock
# through the app; this adds a feature, not a crate. `MEMORYSTATUSEX`
# derives `Default` there, which the probe's zeroed struct relies on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
criterion = "0.5"
zune-jpeg = "0.4"

[[bench]]
name = "hot_path"
harness = false
