[package]
name = "fastcull-app"
description = "FastCull desktop application (Slint UI shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fast_image_resize = "5"
jpeg-encoder = "0.6"
fastcull-core.workspace = true
# femtovg = GPU/OpenGL renderer (ADR 0002). Building it needs system dev
# packages: fontconfig-devel libxkbcommon-devel wayland-devel mesa-libGL-devel
# (dnf) / libfontconfig1-dev libxkbcommon-dev (apt, see CI).
# VERSION-BUMP CANARY: `reveal_scroll`'s ORDER NOTE (nav.rs) proves the
# consumed-geometry mark may land before the vp-y write ONLY because Slint's
# `changed` callbacks are deferred (verified against i-slint-core 1.17.1). A
# Slint release that runs change handlers synchronously silently invalidates
# that proof — re-read that comment before raising this bound.
# SECOND CANARY (issues #63/#64, same 1.17.1). Four measured Slint
# behaviours that the focus machinery depends on, none of them documented
# upstream — if any changes, a silent focus bug comes back:
#   1. `changed has-focus` is deferred, and the GAINER's handler runs
#      before the loser's, which is why the focus-owner token is written
#      by gains only.
#   2. A destroyed focus item delivers no FocusOut (a dangling
#      `ItemWeak`) — the whole reason a reclaim is needed.
#   3. A repeater does NOT tear its children down when the model is
#      replaced; the doomed instances live until its next update, still
#      watching root properties. Hence the generation stamp on
#      `iptc-refocus-row`.
#   4. `self.focus()` called from a repeater row's `init` DOES NOT TAKE
#      EFFECT — it silently does nothing, and `changed absolute-position`
#      does not fire for rows whose first computed position is their last
#      (rows 0 and 1). A row can only claim from a handler that runs
#      after it exists, which is why the refocus flag is armed one
#      event-loop iteration late.
#   5. A component's `changed` handlers CANNOT see a value written in its
#      own `init` (found by CI 2026-09-01): the generated `user_init`
#      runs the `init` statements first and calls `change_tracker*.init`
#      afterwards, so whatever `init` wrote is the tracker's BASELINE.
#      An `init` flip therefore cannot manufacture an edge for a row born
#      into an already-armed refocus request — a per-row `Timer` tick is
#      what claims in that case.
# THIRD CANARY (issue #77, same 1.17.1 + winit 0.30.13). The screenshot
# shutter's "fires once" guard (shutter.rs) exists because of three
# measured behaviours, none of them documented upstream:
#   1. A `TimerMode::Repeated` timer is re-armed at `now + period` BEFORE
#      its callback runs (i-slint-core timers.rs `maybe_activate_timers`),
#      so a callback longer than the period returns already overdue.
#   2. Due timers run inside winit's `new_events`, the FIRST thing in
#      every loop iteration (i-slint-backend-winit event_loop.rs), while
#      `slint::quit_event_loop()` is a winit user event handled later.
#   3. winit's Wayland loop delivers a user event posted during
#      `new_events` one iteration LATER than its X11 and Windows loops do
#      — so the overdue poll ran again before the quit landed, on Wayland
#      only. If any of these changes, the guard becomes dead code rather
#      than wrong, but the count assertion in tests/screenshot.rs is what
#      would notice a new way to photograph twice.
# Re-read the owner-invariant section of specs/modules/ui-grid.md before
# raising this bound.
# FOURTH CANARY (brief 008, the Settings dialog and the Failed badge's
# tooltip; brief 011, the Copy Picks and Export keyboard rings; same
# 1.17.1). Eleven measured behaviours they stand on, none documented
# upstream (read 2026-10-01 in i-slint-core window.rs `process_key_input`,
# items/text.rs, items.rs and properties/change_tracker.rs; 2026-10-02 in
# i-slint-compiler widgets/fluent/checkbox.slint, i-slint-core platform.rs
# and i-slint-backend-winit event_loop.rs; 2026-10-04 in i-slint-core
# window.rs `set_focus_item`/`move_focus`/`take_focus_item`,
# items/input_items.rs and items/text.rs, and i-slint-compiler
# widgets/fluent/button.slint; ui-grid.md's Slint list):
#   1. The WINDOW handles a Tab or Shift+Tab that the focused item and
#      every ancestor scope ignored, by walking the WHOLE item tree to the
#      next focusable item — surfaces hidden behind a scrim included. The
#      Settings, Copy Picks and Export scopes accept both themselves (the
#      last two since brief 011: before it the third Tab in Copy Picks and
#      the fourth in Export put the keyboard on the grid behind the
#      scrim); that is the only reason the keyboard cannot walk out of a
#      dialog into a hidden panel field or the grid.
#   2. A focused item that has become invisible loses the keyboard at the
#      NEXT key, and that key is delivered to nothing — why the dialog's
#      tab bodies are permanent, toggled by `visible`, and a tab switch
#      moves the keyboard to the strip BEFORE the old body hides.
#   3. A `TextInput` ignores Tab, Escape and Ctrl+Tab (control
#      characters), so all three bubble from a focused field to the
#      dialog's scope: Esc in a field closes the dialog, Tab walks on.
#   4. The built-in `Tooltip` (the Failed badge's, `FcTooltip`) is lowered
#      to a `TooltipArea` that observes the pointer without taking it and
#      raises a popup 500 ms into a hover (i-slint-compiler
#      passes/lower_tooltips.rs, i-slint-core items.rs `TooltipArea`). The
#      popup's content is created at that moment — the `failed tooltip
#      shown:` mark a driven test waits on — and the area forwards every
#      press, so the cell under the badge still takes its click.
#   5. A `changed` handler fires only when the value it re-evaluates
#      DIFFERS from the one its tracker stored last time (i-slint-core
#      properties/change_tracker.rs `evaluate`: `if new_value !=
#      *inner_value`), and the trackers run deferred — so a property that
#      goes A → B → A inside one event-loop iteration fires nothing. A
#      click on Reset with `35` typed into a field commits 35 and resets
#      to 25 in one iteration, and the field's `changed shown` re-sync
#      never runs: why the Settings fields commit only what the user
#      EDITED (`dirty`, set by LineEdit's `edited`) and re-show the value
#      in force on every blur (senior-developer review F1, 2026-10-01).
#   6. A `focus()` called from code is not a Tab-navigation focus: a
#      `TextInput` selects all only on `FocusReason::TabNavigation`, and
#      not on Apple targets at all (items/text.rs:1180, FocusIn, guarded by
#      `cfg!(not(target_vendor = "apple"))` — macOS is not a supported
#      seat; re-review RR-F5), so a field the Settings ring focuses
#      selects nothing and the caret stays where it was (at 0 the first
#      time: Tab, 8, Enter put `82 GB`) — why `focus-slot` calls
#      `select-all()` itself (QE 2026-10-01, D33), in the Settings ring
#      and in the Copy Picks ring for the rename field (brief 011: without
#      it a typed `z` went in at the caret, `zx.{ext}`).
#   7. The fluent `CheckBox` flips `checked` and THEN calls `toggled`
#      (widgets/fluent/checkbox.slint:96-101; Space and Enter go through
#      the same `clicked`), and a two-way binding (`checked <=> root.…`)
#      carries a synchronous write of the bound property straight into
#      the box — so a `toggled` handler that first does anything which
#      re-presents that property (the Settings flush's commit runs
#      `present()`) then reads the OLD state from `self.checked`: why both
#      Settings checkboxes read their state into `want` before the flush
#      (QE 2026-10-02, D39).
#   8. The winit backend begins every loop iteration with `new_events`,
#      which calls `update_timers_and_animations` — animations, then the
#      due timers, then `run_change_handlers` (i-slint-core platform.rs
#      :289-293; i-slint-backend-winit event_loop.rs :599-612) — and hands
#      an `invoke_from_event_loop` closure over only later, in
#      `user_event` (:546). So what a TIMER's callback writes — and every
#      driven step is a timer — is seen by the change trackers before a
#      worker's posted completion can overwrite it, however fast the
#      worker: fact 5's A → B → A collapse needs both writes inside one run
#      of the trackers, and these are two. (An input event from the OS
#      runs after that iteration's trackers, so for a real click the same
#      cannot be promised.) Why the Settings Clear row's `Clearing…` and
#      its disabled button are proved by the marks the two elements emit
#      themselves (QE 2026-10-02, round 5; the senior developer's
#      test-integrity review, which first suspected a race here and
#      refuted it in this source).
#   9. A disabled `FocusScope` refuses focus: `FocusScope::focus_event`
#      returns `FocusIgnored` when the scope is not enabled
#      (items/input_items.rs), so the window's Tab walk passes a greyed
#      fluent `Button` over (the pre-fix walk skipped the greyed Copy and
#      reached the grid one Tab sooner, brief 011 D3) — why the copy and
#      export rings' `slot-ok` checks each control's `enabled` as well as
#      the `if` that shows it.
#  10. A `focus()` called from code on an item that refuses focus does not
#      fail: `set_focus_item` runs `move_focus` with
#      `FocusReason::Programmatic` (window.rs :1226, :1315), which skips
#      the visibility test and publishes the next item in tree order that
#      takes the keyboard — inside the dialog or behind its scrim (brief
#      011: the copy ring's `focus()` on the greyed Copy, as a mutant,
#      landed on the grid's scope). Why the two rings focus a slot only
#      after `slot-ok` has approved it.
#  11. A disabled `FocusScope` ignores `FocusOut` too: `focus_event`
#      returns `FocusIgnored` before it reads the event
#      (items/input_items.rs:643), while `take_focus_item` takes the
#      window's focus from it all the same (window.rs:1254). A control
#      disabled while it holds the keyboard therefore keeps `has-focus`
#      true: the fluent `Button` draws its focus border whenever
#      `has-focus && enabled` (widgets/fluent/button.slint:121), so it
#      wears one again once re-enabled, with the keyboard elsewhere, and
#      the next focus on it changes nothing — no `changed has-focus`, no
#      `gained` mark — until it is released while enabled. A `TextInput`
#      tests `enabled` only on `FocusIn` (items/text.rs:1166) and lets go
#      normally. Why the Copy and Export buttons put the keyboard home
#      BEFORE they start the run, which disables Choose… (brief 011, the
#      senior developer's review F1: Tab onto Choose…, a click on Copy,
#      Esc back to the plan — Choose… wore its border with the keyboard at
#      home, and the next Tab onto it was silent).
# FIFTH CANARY (brief 009, the Settings card holds still; same 1.17.1).
# Three measured behaviours the card's one height per open stands on, none
# documented upstream (read 2026-10-03 by the senior developer, and each
# one is in ui-grid.md's "Slint facts this module depends on"):
#   1. A conditional (`if`) or repeated child is created by the generated
#      `ensure_instantiated()` from the item-tree traversal
#      (i-slint-compiler generator/rust.rs :1687-1693, i-slint-core
#      model/repeater.rs :579 `ensure_updated`) — AFTER its parent's
#      `init` has run, so a layout's `preferred-height` read in that
#      `init` does not count it; the child and the change handlers that
#      report the grown height run in the same `ensure_tree_instantiated`
#      pass (window.rs :648, at the end of `process_key_input` :1172 and
#      before every paint :1554), so the growth is never painted — it
#      reaches an `init`-time capture and the layout marks (three per
#      open) only: why the Settings notice line and the environment's
#      line on a SettingRow are PERMANENT elements, blank when silent. If
#      Slint ever instantiates them before the first layout, the
#      permanence is merely unneeded; if it starts creating PERMANENT
#      children late, the card lays out twice per open and
#      `the_settings_card_holds_still_across_its_tabs` says so.
#   2. An empty `Text` is one line tall: `text_size`
#      (i-slint-core textlayout/sharedparley.rs :1514) lays out one empty
#      line and the software and FemtoVG renderers both return its height
#      (17 px at 12 px Noto Sans) — why a blank notice line reserves its
#      line without a probe glyph, and the notice can appear or clear
#      without moving the card.
#   3. `visible: false` is lowered to a `Clip` wrapper around the element
#      (i-slint-compiler passes/visible.rs, `clip: !visible`), which keeps
#      its geometry and its layout constraints, so a hidden element's
#      `preferred-height` is live and exact — why the card can take the
#      TALLEST of the three tab bodies while two of them are hidden.
# SIXTH CANARY (brief 013, the application icon; same 1.17.1 + winit
# 0.30.13). Three behaviours the window's icon stands on, none documented
# upstream (read 2026-10-06 in the sources by the senior developer; each
# one is in app-icon.md's "Slint and winit facts this module depends on"):
#   1. The Slint compiler's Rust output embeds every `@image-url` file by
#      default — `EmbedAllResources` unless SLINT_EMBED_RESOURCES says
#      otherwise (i-slint-compiler lib.rs `CompilerConfiguration::new`) —
#      and slint-build emits `rerun-if-changed` for each embedded file:
#      why `MainWindow.icon` is a path in main.slint and no image ships
#      beside the exe.
#   2. `render_to_buffer` returns an embedded raster image at its own size
#      (i-slint-core graphics/image.rs, `ImageInner::EmbeddedImage`); the
#      64-logical-px target the winit adapter passes applies to SVG only.
#      The buffer is the decoder's premultiplied one, and `icon_to_winit`
#      (winitwindowadapter.rs) premultiplies it again before winit's
#      straight-RGBA `Icon::from_rgba` — a Slint defect (QE 2026-10-06, D5)
#      that darkens only the icon's anti-aliased rim. If an upgrade fixes
#      it, the rim gets lighter and nothing else moves.
#   3. The winit adapter sets BOTH Windows icons from `Window.icon` —
#      `set_taskbar_icon`, then `set_window_icon`
#      (i-slint-backend-winit winitwindowadapter.rs
#      `WinitWindowOrNone::set_window_icon`) — and winit's Wayland
#      `set_window_icon` is an empty function (winit 0.30.13).
# If (1) changes, the icon is read from a path that does not exist on the
# user's machine; if (3) changes, the taskbar button loses the icon while
# the title bar keeps it.
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    # software renderer compiled in solely for --screenshot mode
    # (take_snapshot is unsupported on the GPU renderer -> black frames)
    "renderer-software",
    "compat-1-2",
] }
zune-jpeg = "0.4"
# Native folder picker for File > Open Folder (M5). xdg-portal on Linux =
# no GTK system packages; native dialogs on Windows.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# Remembered copy-dialog prefs (fileops.md: destination + template survive
# across sessions). The directory is core's one config-dir resolver
# (`settings::config_dir`, brief 008), so the app needs no `directories`.
toml = "0.8"

# AttachConsole(ATTACH_PARENT_PROCESS) at startup (issue #40): the crate is
# GUI-subsystem on Windows (see main.rs), and this keeps FASTCULL_TRACE and
# error output visible when the exe is launched from a terminal. Already in
# Cargo.lock many times over transitively; only the console namespace is
# enabled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# The Windows executable's icon (specs/modules/app-icon.md, brief 013):
# build.rs compiles assets/icon/fastcull.ico into fastcull-app.exe with the
# Windows SDK's rc.exe through this crate. A build-dependency on a Windows
# HOST only — Cargo evaluates this cfg against the host — with its default
# `toml` feature off: that feature reads [package.metadata.winresource],
# which this manifest does not carry. With it off the crate's only
# dependency is version_check, already in Cargo.lock.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
zune-jpeg = "0.4"
# tests/app_icon.rs decodes the committed icon PNGs: each `.ico` member is
# compared with its PNG pixel for pixel, and a reproduction mismatch reads
# the pixels before it names a cause (specs/modules/app-icon.md). Already in
# Cargo.lock through Slint's image decoding; a test-only edge.
png = "0.18"

[build-dependencies]
slint-build = "1"
