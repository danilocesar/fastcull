name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's run is disposable; every other run is evidence.
#
# Pull requests share ONE group per ref with `cancel-in-progress: true`.
# Two pushes to a PR branch used to race two 45-minute Windows jobs to a
# finish nobody reads -- 11 of the last 150 runs were cancelled by hand --
# so the second push now stops the first.
#
# Every other event gets a group of its OWN, keyed on `github.run_id`.
# The obvious spelling -- one group per ref for everything, with
# `cancel-in-progress: false` on main -- was what this file said first,
# and it was WRONG (gate, 2026-09-04). `cancel-in-progress: false` does
# NOT mean "both runs proceed". GitHub's actual rule is: a run whose
# concurrency group is already occupied is queued as PENDING, and
# queueing it CANCELS whatever was already pending in that group. Under a
# shared main group, then, main pushes would have SERIALISED -- the
# second waiting out the first's ~45-66 minute Windows job -- and a THIRD
# push inside that window would have cancelled the middle one outright,
# leaving a main commit with no verdict. `false` protects the RUNNING
# run; it is the pending one that dies, and on this repo the pending one
# is a real commit. Main is pushed exactly that fast here: runs
# 33693900007 and 33694019447 are 92 s apart (2026-09-02T23:11:09Z /
# 23:12:41Z) and 33151667132 / 33151754695 are 77 s apart
# (2026-08-28T07:29:51Z / 07:31:08Z).
#
# A per-run group cannot collide, so a main run is never queued behind
# its successor and never cancelled by it. `github.run_id` is stable
# across re-run attempts -- only `run_attempt` increments -- so a re-run
# rejoins the group of the finished run it repeats, which is empty, and
# starts immediately. The ternary is GitHub's `&& ... ||` idiom and is
# safe here because the left result (`github.ref`) is always a non-empty
# string, hence always truthy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow reads the repository and nothing else: it opens no issue,
# writes no comment, pushes no tag. Uploading an artifact is not a
# `contents` write, so read is the whole need -- and stating it means a
# token that escapes into a build script cannot push with it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A red on a remote runner is read from its log alone. Without this a
  # panic prints its message and then "note: run with `RUST_BACKTRACE=1`
  # environment variable to display a backtrace" -- advice nobody can act
  # on once the runner is gone. `1` is the symbolised trace with the test
  # frame on top: +17 lines per failure (measured here on rustc 1.98)
  # against +90 for `full`, whose runtime internals bury the assertion
  # they are meant to explain. The screenshot harness spawns its
  # fastcull-app children without clearing the environment and writes
  # each child's stderr to `<shot>.trace.log`, so an APP panic now
  # reaches the uploaded evidence with its backtrace too.
  RUST_BACKTRACE: 1

jobs:
  test:
    # THE CAP MUST CLEAR A COLD WINDOWS JOB, NOT A WARM ONE. That is the
    # whole sizing rule, and it is `save-if` (below) that makes it bite:
    # pull requests restore and never save, so once main's cache pair is
    # gone every PR push rebuilds from scratch until a push to main saves a
    # new one. Two things take it away:
    # - a rustc release: the toolchain here is `@stable`, unpinned, and the
    #   toolchain is in the restore key, so the first runs after one find
    #   nothing (2026-09-04, rustc 1.98.1);
    # - an idle repository: GitHub evicts a cache entry nobody has read for
    #   seven days, so a week with no run leaves nothing to restore
    #   (main's pair, last used 2026-09-18, was gone when PR #93 opened on
    #   2026-09-26).
    #
    # Measured, all Windows. Warm: 40.1 and 45.3 min (runs 33229151348,
    # 33694019447). Cold before brief 008: 65.7 min (33839957294, the first
    # run after rustc 1.98.1), and since #76 (dependencies compile
    # optimised in debug, 2026-09-05) 57.7-70.0 min (33996087777,
    # 34014978820, 34018510289). PR #93 (brief 008, 2026-09-26 to 09-29):
    # every run fully cold -- no rust cache entry existed, the idle week
    # above -- and its twenty Windows jobs that ran to the end took
    # 53.9-77.8 min (36261597496 .. 36520583463). The same cold Clippy
    # compile took 8.4-8.8 min on some runners and 12.3-13.3 on others, so
    # the cold figure is a range, not a number. Brief 008's A5 (four app
    # children holding the arrow in a 3840x2160 window, from run
    # 36390256213) added about 3 minutes, all in the release screenshot
    # step (15.3-18.9 min before, 18.0-21.9 after; A5 skips on the debug
    # pass); the slow runners have taken 73.6-77.8 min since.
    # The headroom is 22 % of the cap over the worst measured cold run:
    # 90 gave 70.0 min its 20 minutes; 100 gives 77.8 min 22.2. It still
    # replaces GitHub's 6-hour default, under which one hung app child
    # would bill five idle hours of Windows minutes before anyone noticed.
    # Slow is not failed; hung is. Splitting this job, or dropping its
    # debug screenshot pass -- the only debug run of the driven suite on
    # CI -- changes what CI runs, which is the user's call (M3).
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Action versions, to stop the "Node.js 20 is deprecated ... forced
      # to run on Node.js 24" line on every run. ALL THREE ARE NOW
      # node24, which is the whole point and was not true when this file
      # first claimed it: checkout@v5 and cache@v5 declare `using:
      # node24`, but upload-artifact@v5's action.yml still declares
      # `using: 'node20'`, so the bump to v5 left the warning in place
      # and the commit message claimed a fix it had not made (gate,
      # 2026-09-04). upload-artifact@v6 is the tag that carries node24,
      # so both upload sites are at v6.
      #
      # Checked against each action's own action.yml at the tag actually
      # used (`gh api repos/<action>/contents/action.yml?ref=<tag>`): no
      # input this workflow passes was removed or renamed. cache@v5 still
      # takes `path`/`key`/`restore-keys`; upload-artifact@v6 still takes
      # `name`/`path`/`if-no-files-found`/`retention-days`, its input set
      # being byte-identical to v5's (`name`, `path`,
      # `if-no-files-found`, `retention-days`, `compression-level`,
      # `overwrite`, `include-hidden-files`) with only `using:` changed;
      # checkout is used bare. Not v7, which is also node24 but adds an
      # `archive` input and rewrites what `name` means when `archive` is
      # false -- release.yml already runs v7 and can, because it needs
      # that behaviour; this workflow does not. v5's one breaking change
      # that touches us is checkout 5.1.0's `allow-unsafe-pr-checkout`,
      # which gates checking out a fork's code from `pull_request_target`
      # or `workflow_run`; this workflow triggers on `pull_request`,
      # which is unaffected, so the input is left at its default.
      - uses: actions/checkout@v5

      # The screenshot tests write their shots, traces AND fixture copies
      # under the system temp dir (`std::env::temp_dir()`), and the upload
      # step at the end has to name that place. Two constraints decide it:
      # the `runner` context is not available in a job-level `env:` (only
      # in steps), so the choice is made here and exported; and on Windows
      # `place_fixture` COPIES the 63 MB RAW where unix symlinks it — some
      # 80 copies per suite run, twice per job — which must not land on the
      # runner's small D: work drive next to two target dirs (validator
      # 2026-09-02). So Windows gets a folder on C:, Linux the runner temp.
      # The free-space readout is what makes an ENOSPC red legible.
      #
      # `debug/` and `release/` are the two SUITE passes. Windows runs the
      # screenshot tests twice — `has_display()` is `cfg!(windows)`, so the
      # `cargo test --workspace` step runs them in debug and the release
      # step runs them again — and the harness names its output directory
      # `fastcull-shots-<pid>` under `std::env::temp_dir()`, so both passes
      # used to land side by side in one folder with nothing but their
      # content to tell them apart. Each pass now gets its own temp dir
      # (set per step below), which is the only thing the harness reads.
      - name: Point the temp dir at an uploadable, roomy place
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            evidence='C:/fastcull-tmp'
          else
            evidence="$RUNNER_TEMP/fastcull-tmp"
          fi
          mkdir -p "$evidence" "$evidence/debug" "$evidence/release"
          {
            echo "TMPDIR=$evidence"
            echo "TEMP=$evidence"
            echo "TMP=$evidence"
            echo "FASTCULL_EVIDENCE=$evidence"
          } >> "$GITHUB_ENV"
          echo "temp dir: $evidence"
          df -h || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # libjpeg-turbo (the loupe's decoder, ADR 0005) is built from source by
      # the `cmake` crate and its SIMD kernels need NASM; `require-simd` makes a
      # seat without it FAIL rather than ship a 1.95x slower decoder. Chocolatey
      # rather than a setup action because it is the mechanism the release
      # workflow will use (`[dist.dependencies.chocolatey]`, added with the
      # release plumbing), so this job rehearses it. The package installs to
      # `C:\Program Files\NASM`, which CMake's own
      # NASM lookup (`CMakeDetermineASM_NASMCompiler.cmake`, `$ENV{ProgramFiles}/NASM`)
      # searches when nasm is not on PATH — no PATH step needed. Under
      # `require-simd` the vendored `simd/CMakeLists.txt` calls
      # `enable_language(ASM_NASM)` unconditionally (line 52), so the build
      # itself fails without NASM: a green build is the proof. Cargo shows a
      # build script's output only when the script fails, so libjpeg-turbo's
      # configure lines never reach this log on a green run; "Verify Windows
      # artifact" below prints the `WITH_SIMD = 1` line from each build's
      # output file instead (senior-developer review 2026-09-26, F3: this
      # comment named a configure line the log does not contain).
      #
      # ninja is not installed here: the MSVC target's CMake generator is Ninja
      # (`.cargo/config.toml`, 01-architecture.md "Native dependencies"), and
      # ninja is preinstalled on this image and on the release runner's
      # (`windows-2022`), like cmake; a configure that cannot find it fails
      # loudly rather than building unoptimised.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress -y

      # nasm assembles libjpeg-turbo's SIMD kernels; without it `require-simd`
      # fails the build (ADR 0005). Ubuntu 24.04's nasm 2.16.01 is well above
      # libjpeg-turbo's minimum; cmake is on the runner image already, and
      # the image's libjpeg-turbo (2.1.x) is too old for the pkg-config path,
      # so the library is built from source here as on every other seat.
      - name: Install Linux GUI build dependencies (slint/winit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb nasm

      # `save-if` main-only. Measured 2026-09-04 (`gh api
      # .../actions/cache/usage` and `.../actions/caches`): 8 entries,
      # 11.50 GB active against a 10 GB quota -- i.e. already OVER, with
      # GitHub evicting least-recently-used to get back under. (The 4.15
      # GB this comment used to claim was a partial sum; the gate caught
      # it.) The real case for `save-if` is stronger than a total,
      # though: 3.67 GB of that 11.50 -- 32 %, two rust-cache entries at
      # `refs/pull/72/merge` -- is PR-SCOPED, written by PR #72
      # (`ci-timing`), which merged at 2026-09-04T15:15:49Z and whose
      # branch no longer exists, and readable by nothing that runs now. A
      # PR cache is dead the moment the PR lands, and every one of them
      # pushes a live main entry towards eviction. `save-if` is what
      # stops them being written. Pull requests restore what main built
      # and save nothing; main is the only writer, one entry per OS.
      # `cache-on-failure`: the action's post step is `post-if: success()
      # || env.CACHE_ON_FAILURE == 'true'`, so without this a red run on
      # main throws away everything it had already compiled and the next
      # run starts cold -- which is exactly the 20 extra minutes the
      # 2026-09-04 cold Windows cache cost.
      #
      # THE KEY MOVES WITH THE PROFILE, AND NOBODY BUMPS ANYTHING BY HAND.
      # The key the action computes never reads the workspace `Cargo.toml`.
      # From its source at the commit the `v2` tag resolves to (v2.9.2,
      # 6323deb, `src/config.ts`): prefix, then the `key` input, then job
      # id + OS + arch (lines 73-95); then 8 hex digits of a SHA-1 over
      # `rustc -vV` and every env var whose name starts
      # CARGO/CC/CFLAGS/CXX/CMAKE/RUST (104-131); then 8 more over
      # `.cargo/config.toml`, `rust-toolchain{,.toml}`, the manifests of
      # the workspace MEMBERS that `cargo metadata --no-deps` lists, and
      # the Cargo.lock entries that carry a `source` or `checksum`
      # (156-261). A `[profile]` table counts only in the workspace root
      # (cargo: "profiles for the non root package will be ignored"), and
      # this root `Cargo.toml` is a virtual manifest -- no `[package]`,
      # not a member, never read. The log's `Lockfiles considered` is
      # Cargo.lock plus the three `crates/*/Cargo.toml`, nothing else.
      #
      # So #76's `[profile.dev.package."*"]` line did not move the key.
      # The main run that landed it (34007321960; 34013585441 after it
      # did the same, both jobs) restored the stock-profile entry under
      # the unchanged `v0-rust-...` key, rebuilt the dev-profile
      # dependencies (238 `Compiling` lines in the clippy step and 454 in
      # `Tests`, against 1 and 3 on the last cached run, 33986518746),
      # and its post step said `Cache up-to-date.` and saved nothing: a
      # full-match restore leaves `save.ts` no state to save from (lines
      # 25-28). Every run after it paid the same cold dev build -- 26-31
      # min ubuntu, 58-62 min windows, against 17 m 33 s / 33 m 48 s
      # cached -- until `prefix-key: v1-rust` (brief 003, PR #82,
      # 2026-09-06), a version number this comment then said to bump by
      # hand on any root `[profile]` change. That rule lasted one
      # morning: its failure is silent by construction -- a forgotten
      # bump keeps every run green and 10-25 minutes slower per job --
      # so brief 004 replaced it, the same day, with the step below.
      #
      # THE STEP BELOW HASHES THE `[profile]` TABLES OF THE ROOT
      # `Cargo.toml`, AND THE HASH IS PART OF THE KEY. It parses the
      # manifest with Python's `tomllib` (3.11+; both runner images ship
      # 3.12 -- ubuntu-24.04 has 3.12.3 as `python3`, windows-2025 has
      # 3.12.10 as `python`, from the images' software lists -- and the
      # step prints the version it found), takes the `profile` table,
      # `{}` when there is none, writes it as canonical JSON (keys sorted
      # at every level, no whitespace) and keeps 8 hex digits of its
      # SHA-256. For the manifest as it stands that is `a66a9ea8`, from
      # `{"dev":{"package":{"*":{"opt-level":2}}},"dist":{"inherits":
      # "release","lto":"thin"},"release":{"lto":"thin","opt-level":3}}`
      # (measured 2026-09-06; `specs/01-architecture.md`, "Build
      # profiles", has the mutants). `opt-level = 2` -> `3` moves it to
      # `1395f519`; a version bump, a comment edit, a reordered table and
      # a CRLF checkout of the same file leave it alone, and a member
      # manifest is not read by it at all (the action's own hash covers
      # those). A manifest that does not parse FAILS THE JOB with an
      # `::error::` line -- never a default: a step that fell back to a
      # constant would be #76 again, silently. The `tr -d '\r'` is for
      # Windows, where Python writes `\r\n` to a pipe (CPython
      # `Python/pylifecycle.c`, `create_stdio`: "sys.stdout and
      # sys.stderr: translate \n to \r\n") and the 8-hex check below
      # would otherwise reject a correct hash. The rust-cache step takes
      # the hash as its `key` input, which the action puts directly after
      # the prefix (`config.ts` 79-82), so it is in the restore key and
      # the primary key alike and a profile change misses both -- e.g.
      # `v1-rust-profile-a66a9ea8-test-Linux-x64-91e3cbda-aacf1ed2`. The
      # guard step between the two re-reads the same expression the
      # rust-cache step reads: a renamed step id, a renamed output or a
      # skipped hash step would otherwise evaluate to '' and leave the
      # key at a constant `profile-` -- green, and never moving again.
      #
      # `prefix-key: v1-rust` is now the escape hatch only: bump it for a
      # change to the ACTION or to the KEY'S FORMAT (a rust-cache release
      # that hashes differently, a change to the step's command), and NOT
      # for a profile change, which the hash covers. Not `hashFiles(
      # 'Cargo.toml')` as the key -- that moves it on every release's
      # version bump and every comment edit, a cold pair of jobs each
      # time, silently -- and not an `awk` slice of the file either: the
      # first draft of this rule sliced the text and captured the
      # comment block between two profile tables. A key move costs once,
      # and more than the post-#76 runs above: a run under a NEW key
      # rebuilds both halves of the entry, the release half included --
      # PR #82's run 34014978820 took 33 m 28 s ubuntu / 1 h 09 m 58 s
      # windows, the first main save under v1 (34018510289) 34 m 40 s /
      # 57 m 43 s including the save (28 s / 2 m 15 s). The first main
      # run under a new key is cold and saves, pull requests before it
      # are cold too, and the old key's entries sit orphaned until GitHub
      # evicts them (unused for 7 days, or oldest access first over the
      # 10 GB limit) or they are deleted by hand. On a pull request the
      # proof that the key moved is the RESTORE step -- `Cache Key:`
      # shows the component and the line after `... Restoring cache ...`
      # is `No cache found.` -- and the post step is silent (`save-if`
      # false returns before it logs anything), so its silence is not a
      # failed save.
      - name: Hash the root manifest's [profile] tables
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS:-}" = "Windows" ]; then py=python; else py=python3; fi
          "$py" --version
          hash="$("$py" - <<'EOF' | tr -d '\r'
          import hashlib, json, sys, tomllib
          try:
              with open("Cargo.toml", "rb") as f:
                  doc = tomllib.load(f)
          except (OSError, tomllib.TOMLDecodeError) as e:
              print(f"::error::Cargo.toml did not parse; no profile hash: {e}", file=sys.stderr)
              sys.exit(1)
          profile = doc.get("profile", {})
          if not isinstance(profile, dict):
              print(f"::error::Cargo.toml: profile is not a table: {profile!r}", file=sys.stderr)
              sys.exit(1)
          canon = json.dumps(profile, sort_keys=True, separators=(",", ":"))
          print(hashlib.sha256(canon.encode("utf-8")).hexdigest()[:8])
          EOF
          )"
          [[ "$hash" =~ ^[0-9a-f]{8}$ ]] || { echo "::error::profile hash is '$hash', not 8 hex digits"; exit 1; }
          echo "profile hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Assert the profile hash reached the cache key
        shell: bash
        env:
          PROFILE_KEY: profile-${{ steps.profile.outputs.hash }}
        run: |
          set -euo pipefail
          [[ "$PROFILE_KEY" =~ ^profile-[0-9a-f]{8}$ ]] || { echo "::error::cache key component is '$PROFILE_KEY', not profile-<8 hex>: the hash step's output did not reach the key"; exit 1; }
          echo "rust-cache key component: $PROFILE_KEY"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: profile-${{ steps.profile.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Content-addressed on the fetch script, because that script IS the
      # contents: it carries the file list, the URLs and the expected byte
      # sizes that pin the upstream revisions. The old key was the literal
      # `testdata-raws-v1`, which never changed -- every run logged "Cache
      # hit occurred on the primary key testdata-raws-v1, not saving cache"
      # -- so adding or resizing a RAW in fetch.sh would have restored the
      # stale entry forever, and the fetch step would have silently
      # re-downloaded the missing file on every single run. The prefix
      # restore-key keeps the old copy useful across such an edit: the
      # files already there at the right size are skipped, and only the
      # changed one is fetched.
      #
      # Two consequences of the v1 -> v2 bump, both one-off and both
      # worth stating rather than discovering (gate, 2026-09-04). First,
      # the `testdata-raws-v2-` restore prefix does NOT match
      # `testdata-raws-v1`, so the first run restores nothing and
      # re-downloads the RAWs once -- 240 MB, on BOTH seats, since the
      # key carries no OS and each of the two `Fetch sample RAWs` steps
      # runs the script -- before saving a v2 entry the next run reuses.
      # Second, the `testdata-raws-v1` entries still in the cache are now
      # ORPHANED: 240.3 MB each, 0.48 GB together, created 2026-08-22,
      # and there are two of them for the one key because `actions/cache`
      # keys an entry by path AND compression, which is what separates
      # the Linux copy from the Windows one. Nothing will restore them
      # again and nothing overwrites them, so they hold quota until
      # GitHub's least-recently-used eviction takes them. Both costs are
      # the price of the key being content-addressed at last, paid once.
      - name: Cache sample RAWs
        uses: actions/cache@v5
        with:
          path: testdata/raws
          key: testdata-raws-v2-${{ hashFiles('testdata/fetch.sh') }}
          restore-keys: |
            testdata-raws-v2-

      - name: Fetch sample RAWs
        if: runner.os != 'Windows'
        run: testdata/fetch.sh
      - name: Fetch sample RAWs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: testdata/fetch.sh

      # `cargo fmt` cannot carry `--locked` and does not need to: the
      # subcommand rejects the flag outright ("error: unexpected argument
      # '--locked' found"), and measured against a deliberately stale
      # lockfile it exits 0 having left Cargo.lock byte-identical
      # (sha256 unchanged). It neither guards nor drifts, so the guard
      # belongs on the step after it.
      - name: Format check
        run: cargo fmt --all -- --check

      # `--locked` STARTS HERE, and that is the point. It went on the
      # four `cargo test` invocations first and guarded nothing (gate,
      # 2026-09-04), because clippy ran earlier WITHOUT it and cargo's
      # default is to repair a stale lockfile silently. Proved locally by
      # deleting a single `[[package]]` entry from Cargo.lock: unguarded,
      # `cargo clippy --workspace --all-targets -- -D warnings` printed
      # "Locking 1 package to latest compatible version / Adding cfg-if
      # v1.0.4", rewrote the file back to its original sha256 and exited
      # 0 -- after which every `--locked` step downstream was satisfied
      # by a lockfile clippy had just fixed for it. With the flag, the
      # same stale lock stops the job at the first cargo step that can
      # resolve anything: "error: cannot update the lock file ... because
      # --locked was passed to prevent this", exit 101, Cargo.lock left
      # untouched. The lockfile decides what is built AND feeds
      # rust-cache's key, so a resolver that quietly picks a different
      # version changes both the thing under test and the cache it
      # restores from. Fail instead of drifting.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--test-threads=1`: every test in
      # fastcull-app/tests/screenshot.rs takes ONE process-wide mutex as
      # its first statement and holds it to the end (core's
      # tests/loupe.rs and tests/perf_budgets.rs guard themselves the
      # same way), so libtest's default pool never ran two of them in
      # parallel. All it did was start each test's clock when it was
      # QUEUED, which is where the 39 "has been running for over 60
      # seconds" warnings of the v0.13.1 run (33694019447) came from --
      # 34 on windows-latest, 5 on ubuntu-latest, one of them
      # `two_distant_clicks...`, which warned at 60 s and finished 2.2 s
      # later -- and why the per-test times in the log were lock-wait,
      # not work. Windows runs the screenshot suite in THIS step too
      # (`has_display()` is `cfg!(windows)`), so the flag belongs here
      # as well; 6 of those warnings come from core's tests/loupe.rs,
      # which the `--workspace` form covers. Nothing is hidden by it:
      # the pool only ever overlapped core's own test binaries, whose
      # scratch paths are unique per process and thread, and the two
      # contention-sensitive ones keep their concurrency INSIDE one test
      # -- there is no cross-test race for the flag to mask. Cost, twice
      # measured on a 4-core / 8-thread laptop ("an 8-core laptop" here
      # until 2026-09-26, which counted threads): the screenshot binary
      # does not move (892.5 -> 892.8 s, and 872.0 -> 870.6 s in the
      # second round), and the rest of the workspace loses between 12 s
      # and 24 s. The two
      # rounds disagree on WHICH binary pays -- loupe.rs +14 s in one and
      # +0.8 s in the other -- so only the total is quotable, and even it
      # is noise-dominated at this size. The
      # warnings were also the log's only heartbeat during this step;
      # what replaces it is the harness's 90 s child watchdog, the app's
      # 30 s `wait:` cap and the shutter's 60 s readiness cap, each of
      # which names its own failure.
      #
      # `--locked` is on this and every other cargo invocation in the
      # job, but the one that actually stops a drift is the CLIPPY step
      # above -- see the reasoning there. By the time control reaches a
      # test step, an unguarded earlier step would already have rewritten
      # the lockfile and made this flag a no-op. Uniform here so that
      # reordering the steps cannot reopen the hole. (`cargo build` in
      # the Windows artifact step already had it.)
      - name: Tests
        env:
          # The debug pass of the screenshot suite (Windows only; on Linux
          # this step has no display and the tests skip).
          TMPDIR: ${{ env.FASTCULL_EVIDENCE }}/debug
          TEMP: ${{ env.FASTCULL_EVIDENCE }}/debug
          TMP: ${{ env.FASTCULL_EVIDENCE }}/debug
        run: cargo test --workspace --locked -- --test-threads=1

      # `-screen 0 3840x2160x24` pins the headless seat. What the pin
      # buys is a STATED CONSTANT in place of a distro default, and a
      # screen as large as the largest window the suite asks for. This
      # comment used to imply a hazard as well, and the gate struck it
      # (2026-09-04): it said xvfb-run's default `-screen 0 1280x1024x24`
      # is "160 px NARROWER than the window these tests drive", inviting
      # the reader to conclude the old seat was clipping something. It is
      # narrower. It was never observed to break anything, and the
      # evidence says it would not have:
      #
      #   * the shot is not an X screen grab. It is Slint's own
      #     `take_snapshot` (shutter.rs), which renders the WINDOW's
      #     surface at the window's size, whatever the root window
      #     measures;
      #   * the one resolution-shaped assertion in the suite,
      #     `grid_shot`'s `w == 1440`, is a SCALE-FACTOR check -- it
      #     catches a HiDPI seat, which a screen size cannot move;
      #   * and the suite has been driving 1600x800 -- 320 px wider than
      #     1280 -- green on the 1280-wide server all along.
      #
      # So the case for pinning is the constant itself: ui-grid.md
      # reasons about this seat, and a seat the specs reason about must
      # not change under them because a runner image bumped a default.
      # Its SIZE is 3840x2160 since brief 008 (it was 1920x1200): the 4K
      # fit hold (ui-grid.md A5, `a_held_arrow_at_fit_on_4k_stays_at_the_
      # rung_and_never_slows`) resizes its window to 3840x2160, and that
      # geometry is what its numbers are about, so the window lies inside
      # the screen as it would on a real 4K display. It still contains
      # every other geometry the suite drives -- TWELVE distinct ones
      # (`grep -o 'resize:[0-9]*x[0-9]*'
      # crates/fastcull-app/tests/screenshot.rs | sort -u`): 640x300,
      # 900x800, 1000x700, 1010x520, 1024x768, 1200x800, 1440x700,
      # 1440x900, 1500x800, 1600x800, 3000x1800 and 3840x2160, plus the
      # 1440x900 the app opens at (`preferred-width`/`preferred-height`,
      # main.slint).
      # The cost is the framebuffer, 33 MB at depth 24, which is true
      # colour, so the uploaded JPEGs are not read through a quantised
      # palette.
      #
      # `FASTCULL_A5_REQUIRE_4K` is read by that one test and never by the
      # app (test-harness.md): here A5 must RUN, so a seat that did not
      # grant the window, a missing display or a debug build fails it
      # instead of skipping it. Both release steps set it: the Windows
      # runner grants 3840x2160 too (run 36390256213, its probe's
      # `window geometry 3840x2160`), and without the switch a later image
      # granting less would skip A5 there in silence -- libtest hides a
      # passing test's output, so only the missing a5-*.trace.log files
      # would tell. Never on the Tests step above: it runs the driven
      # suite in DEBUG on Windows, where the switch turns A5's debug skip
      # into a failure.
      - name: Screenshot smoke tests (Linux, headless X)
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ env.FASTCULL_EVIDENCE }}/release
          FASTCULL_A5_REQUIRE_4K: "1"
        run: xvfb-run -a --server-args="-screen 0 3840x2160x24" cargo test --release --locked -p fastcull-app --test screenshot -- --test-threads=1
      - name: Screenshot smoke tests (Windows)
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ env.FASTCULL_EVIDENCE }}/release
          TMP: ${{ env.FASTCULL_EVIDENCE }}/release
          FASTCULL_A5_REQUIRE_4K: "1"
        run: cargo test --release --locked -p fastcull-app --test screenshot -- --test-threads=1

      # The shots and the per-run `<name>.trace.log` beside them. Uploaded
      # on EVERY run, not only on failure: a Windows red is read by
      # comparing it against the same test's Linux green (geometry marks,
      # badge pixels), so the green run's evidence has to exist too.
      #
      # The two file patterns, never the whole directory: the tests place
      # fixture RAWs in sub-folders of it, and `place_fixture` COPIES on
      # Windows where it symlinks on unix — a 63 MB frame per copy, some
      # gigabyte of artifact for evidence that is a few MB of JPEG and
      # text. Shots are written at the top level, fixtures never are.
      #
      # Named per PASS, so the artifact opens as `debug/` and `release/`
      # and a reader never has to identify a Windows shot by its content.
      # The two directories are spelled out rather than globbed for a
      # reason: upload-artifact takes the artifact's root from the LEAST
      # COMMON ANCESTOR of the patterns' non-magic prefixes, not of the
      # files it found, so naming both keeps the root at the evidence dir
      # and the labels intact even when a pass produced nothing -- which
      # is every Linux run, where the debug step has no display.
      #
      # 30 days, against 14 for the binaries: 7 was shorter than the loop
      # it serves. A Windows red is diagnosed by comparing its traces
      # against the same test's Linux green, and an intermittent is often
      # only recognised as one when it recurs a fortnight later -- at
      # which point the first run's evidence had already expired.
      # `if-no-files-found: warn`, not `ignore`: an evidence path that
      # stops matching is a silent loss of the only thing a remote red
      # leaves behind, and it should say so in the log.
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-evidence-${{ matrix.os }}
          path: |
            ${{ env.FASTCULL_EVIDENCE }}/debug/fastcull-shots-*/*.jpg
            ${{ env.FASTCULL_EVIDENCE }}/debug/fastcull-shots-*/*.trace.log
            ${{ env.FASTCULL_EVIDENCE }}/release/fastcull-shots-*/*.jpg
            ${{ env.FASTCULL_EVIDENCE }}/release/fastcull-shots-*/*.trace.log
          if-no-files-found: warn
          retention-days: 30

      # Advisory only (user decision 2026-07-25): shared virtualized runners
      # cannot gate wall-clock budgets; enforcement happens on an idle run
      # of the development machine in every gate round (issue #27 decision,
      # specs/01-architecture.md).
      # `--test-threads=1` here for the same reason as the steps above
      # (QE 2026-09-03; the REASON corrected 2026-09-04): every test in
      # perf_budgets.rs takes a process-wide mutex, so the pool queues
      # them, and a test's 60 s warning timer starts when libtest QUEUES
      # it rather than when the mutex lets it run -- the same queued-clock
      # exposure the flag removes in the steps above. It is NOT about the
      # measurements: each budget test takes the guard as its FIRST
      # statement and starts its own Instant inside the guarded region,
      # so a lock-wait never entered a budget number (the note that stood
      # here said one could, and that was wrong). No warning has been
      # observed from this step, and serialising tests that already
      # serialise themselves costs it nothing, so uniformity across the
      # four invocations is the whole case for the flag here.
      # `--nocapture` (brief 008, 2026-09-26): this step never fails its
      # job, so its numbers are read from the log or not at all, and libtest
      # prints a passing test's output only with the flag. Every row prints
      # one `BUDGET-MEDIAN` line before its assertion, so each median lands
      # here green or red. Without it brief 008's first Windows run showed
      # three red rows inside a green job and not one number on the green
      # ones (senior-developer review 2026-09-26, F1; 01-architecture.md,
      # "Performance budgets").
      - name: Performance budgets (release, advisory)
        continue-on-error: true
        run: cargo test --release --locked -p fastcull-core --test perf_budgets -- --test-threads=1 --nocapture

      # ---------------------------------------------------------------
      # Windows test build. These steps sit last in the job, so the .exe
      # is only produced once this job's own checks have passed.
      #
      # `-C target-feature=+crt-static` links the Microsoft C runtime into
      # the .exe instead of loading it from the machine at start-up. The
      # user can then copy the file to any Windows box without first installing
      # the "Visual C++ Redistributable".
      #
      # Every other build in this job is static too since brief 008's QE
      # round 1 (D4): the workspace `.cargo/config.toml` sets the same flag
      # for every MSVC target, build scripts and proc macros included, so
      # the test binaries link one C runtime beside libjpeg-turbo's static
      # one. RUSTFLAGS restates the flag here, where it replaces the file's,
      # so the shipped .exe stays static whatever that file says -- as
      # cargo-dist's `msvc-crt-static` does for the release archives.
      # `--target x86_64-pc-windows-msvc` keeps this build in its own
      # directory, the same thing cargo-dist does (see dist-workspace.toml):
      # output lands in target/x86_64-pc-windows-msvc/release/ rather than
      # target/release/, next to the release copies the screenshot and perf
      # steps built. (Until D4 this comment said RUSTFLAGS without `--target`
      # would reach build scripts and proc macros, "exactly the mismatch that
      # makes static-CRT builds fail in confusing ways"; on the MSVC target
      # every step above now builds that way, and this job is the check.)
      # ---------------------------------------------------------------
      - name: Build Windows test binaries (release, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p fastcull-app -p fastcull-cli

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        env:
          # On a pull_request event GITHUB_SHA is a throwaway merge commit
          # that GitHub garbage-collects, so it is useless as the "here is
          # the corresponding source" pointer the GPL asks for. Prefer the
          # real head commit of the branch under test.
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          bindir=target/x86_64-pc-windows-msvc/release
          # Start from an empty folder: CI checkouts are fresh, but this step
          # is also meant to be runnable locally, where a leftover file from a
          # previous run would otherwise be uploaded as if it belonged.
          rm -rf artifact
          mkdir -p artifact
          cp "$bindir/fastcull-app.exe" artifact/
          cp "$bindir/fastcull-cli.exe" artifact/
          # Licence obligations: our own GPL text plus a pointer to the
          # corresponding source, and the notices of the third-party crates
          # linked into these executables.
          cp LICENSE artifact/
          cp README.md artifact/
          cp THIRD-PARTY-LICENSES.md artifact/
          cat > artifact/BUILD-INFO.txt <<EOF
          FastCull unsigned Windows test build
          ====================================

          commit:   ${SOURCE_SHA}
          ref:      ${SOURCE_REF}
          run:      ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          built at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          These binaries are not code-signed. Windows SmartScreen will show
          "Windows protected your PC" the first time you start them: click
          "More info", then "Run anyway".

          FastCull is free software; see LICENSE for the GNU General Public
          License and THIRD-PARTY-LICENSES.md for the licences of the
          libraries linked into these executables. The complete
          corresponding source for this build is the commit above, at
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          EOF

      # The README and BUILD-INFO.txt promise "no Visual C++ Redistributable
      # needed". Check it instead of trusting it: a statically linked binary
      # has no VCRUNTIME140 import, and the .exe must actually start.
      #
      # PE subsystem (issue #40): fastcull-app must be a GUI-subsystem
      # executable (double-click opens no console; closing a console cannot
      # kill it) while fastcull-cli must STAY console-subsystem (a terminal
      # tool that prints to the shell that ran it). The Subsystem field is a
      # u16 in the PE optional header: e_lfanew (u32 at 0x3C) + 4-byte
      # "PE\0\0" + 20-byte COFF header + offset 68. 2 = WINDOWS_GUI,
      # 3 = WINDOWS_CUI. v0.8.0 shipped both as 3 -- that regression is what
      # this assertion pins.
      #
      # libjpeg-turbo compiled optimised (brief 008 A10; 01-architecture.md,
      # "Native dependencies"). On the MSVC target the `cmake` crate, when it
      # picks the Visual Studio generator itself, overwrites the C flags of
      # the configuration it builds with the `cc` crate's, every /O flag
      # stripped, and MSVC then compiles the loupe's decoder at its
      # unoptimised default: brief 008's first artifact shipped that way, its
      # 3/8 rung decoding slower than the full frame (senior-developer review
      # 2026-09-26, F1). The workspace `.cargo/config.toml` names the
      # generator, Ninja; this check reads what each build actually used, with
      # no clock: every turbojpeg-sys `CMakeCache.txt` under target/ must carry
      # /O2 in the C flags of the configuration its CMAKE_BUILD_TYPE names.
      # That one and not always `_RELEASE`: with debug info the crate builds
      # RelWithDebInfo and, under its own pick of generator, overwrites THAT
      # configuration's flags, while `_RELEASE` keeps CMake's default /O2, so
      # reading `_RELEASE` would pass an unoptimised library. The debug
      # suite's, the release suite's and the artifact's builds are all read,
      # and the artifact's must be among them, so a moved path fails instead
      # of checking nothing. The build script's `output` beside each cache
      # must carry libjpeg-turbo's `WITH_SIMD = 1` configure line (its NASM
      # kernels are in): cargo shows that file only when a build script
      # fails, so this step is where the line reaches the log. Every line it
      # judges is printed, pass or fail.
      - name: Verify Windows artifact (static CRT + subsystems + starts + optimised decoder)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for exe in artifact/fastcull-app.exe artifact/fastcull-cli.exe; do
            if grep -aq 'VCRUNTIME140' "$exe"; then
              echo "::error::$exe imports VCRUNTIME140 -- the static CRT flag did not take effect"
              exit 1
            fi
            # A dynamic decoder is imported by DLL name, and a static one cannot carry the name (A10).
            if grep -aqiE 'turbojpeg\.dll|jpeg62\.dll' "$exe"; then
              echo "::error::$exe imports libjpeg-turbo dynamically -- the loupe's decoder must be linked statically (ADR 0005)"
              exit 1
            fi
          done
          python - <<'EOF'
          import struct, sys

          def subsystem(path):
              with open(path, "rb") as f:
                  head = f.read(0x2000)
              pe = struct.unpack_from("<I", head, 0x3C)[0]
              assert head[pe:pe + 4] == b"PE\0\0", f"{path}: no PE signature"
              return struct.unpack_from("<H", head, pe + 4 + 20 + 68)[0]

          want = {"artifact/fastcull-app.exe": 2, "artifact/fastcull-cli.exe": 3}
          bad = False
          for exe, expected in want.items():
              got = subsystem(exe)
              print(f"{exe}: subsystem={got} (want {expected})")
              if got != expected:
                  print(f"::error::{exe} has PE subsystem {got}, expected {expected} "
                        "(2=GUI, 3=console; see issue #40)")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF
          ./artifact/fastcull-cli.exe --version
          python - <<'EOF'
          import glob, os, sys

          # target/<profile>/build/... and target/<triple>/<profile>/build/...
          caches = sorted(
              glob.glob("target/*/build/turbojpeg-sys-*/out/build/CMakeCache.txt")
              + glob.glob("target/*/*/build/turbojpeg-sys-*/out/build/CMakeCache.txt")
          )
          artifact_build = "target/x86_64-pc-windows-msvc/release/build/"
          bad = False
          if not any(c.replace("\\", "/").startswith(artifact_build) for c in caches):
              print(f"::error::no turbojpeg-sys CMakeCache.txt under {artifact_build} -- "
                    "the optimisation check has nothing to read for the artifact")
              bad = True

          def cache_entries(path):
              # CMakeCache.txt lines are `NAME:TYPE=VALUE`; `//` and `#` are comments.
              entries = {}
              with open(path, encoding="utf-8", errors="replace") as f:
                  for line in f:
                      line = line.rstrip("\r\n")
                      if line.startswith(("#", "//")) or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      entries[key.split(":", 1)[0]] = value
              return entries

          for cache in caches:
              entries = cache_entries(cache)
              build_type = entries.get("CMAKE_BUILD_TYPE", "")
              flags_var = "CMAKE_C_FLAGS_" + build_type.upper()
              flags = entries.get(flags_var) if build_type else None
              print(cache)
              print(f"  CMAKE_GENERATOR={entries.get('CMAKE_GENERATOR', '(absent)')}")
              print(f"  CMAKE_BUILD_TYPE={build_type or '(absent)'}")
              print(f"  {flags_var}={'(absent)' if flags is None else flags}")
              if flags is None or "/O2" not in flags.split():
                  print(f"::error::{cache}: {flags_var} does not carry /O2 -- MSVC compiled "
                        "libjpeg-turbo unoptimised (the cmake crate's MSVC flag override; "
                        "01-architecture.md, Native dependencies)")
                  bad = True
              # .../build/turbojpeg-sys-<hash>/out/build/CMakeCache.txt -> .../turbojpeg-sys-<hash>/output
              output = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(cache))), "output")
              lines = []
              if os.path.isfile(output):
                  with open(output, encoding="utf-8", errors="replace") as f:
                      lines = [line.strip() for line in f]
              for line in lines:
                  if "WITH_SIMD" in line or line.startswith(
                      ("CMAKE_GENERATOR", "HOST_CMAKE_GENERATOR", "TARGET_CMAKE_GENERATOR")
                  ):
                      print(f"  {line}")
              if not any("WITH_SIMD = 1" in line for line in lines):
                  print(f"::error::{output}: no 'WITH_SIMD = 1' line -- libjpeg-turbo was "
                        "built without its SIMD kernels")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF

      # Every Windows build links ONE C runtime, the static one (brief 008,
      # QE round 1, D4; 01-architecture.md, "Native dependencies").
      # libjpeg-turbo, the loupe's decoder, is built by its own CMake with the
      # static runtime (`WITH_CRT_DLL` off, its default), so a Rust build that
      # links the runtime DLL puts both runtimes in one executable: MSVC's
      # linker warns LNK4098 ("defaultlib 'LIBCMT' conflicts with use of other
      # libs") and links anyway. The artifact never did -- it is built with
      # `+crt-static` and read above -- but this job's test, screenshot and
      # perf builds did, once per build step, from brief 008's first run on
      # (run 36454920187: three LNK4098 lines; main's last run before brief
      # 008, 35296909886: none). So every MSVC build is static too -- the
      # workspace `.cargo/config.toml` sets `+crt-static` for every MSVC
      # target -- and this step reads every executable those builds left and
      # fails on one that imports VCRUNTIME140, the runtime DLL's name, which
      # a static build cannot carry. The artifact's own directory is the step
      # above's.
      - name: Verify every Windows build links the static C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          builds=(target/debug/*.exe target/debug/deps/*.exe target/release/*.exe target/release/deps/*.exe)
          if [ "${#builds[@]}" -eq 0 ]; then
            echo "::error::no executable under target/debug or target/release -- the static-runtime check has nothing to read"
            exit 1
          fi
          dynamic=0
          for exe in "${builds[@]}"; do
            if grep -aq 'VCRUNTIME140' "$exe"; then
              echo "::error::$exe imports VCRUNTIME140 -- it links the C runtime DLL beside libjpeg-turbo's static runtime"
              dynamic=$((dynamic + 1))
            fi
          done
          echo "${#builds[@]} executables read, ${dynamic} importing VCRUNTIME140"
          [ "$dynamic" -eq 0 ]

      - name: Upload Windows test binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: fastcull-windows-x64
          path: artifact/
          retention-days: 14
          if-no-files-found: error

      # `if: always()`, and last, so the disk reading is taken at the END
      # of the job — after two target dirs, the fetched RAWs and some 80
      # fixture copies exist. The workflow used to print `df -h` once at
      # the start, which is the one moment it cannot answer an ENOSPC.
      # This step is what turns "why only on CI" into something a reader
      # can settle on sight: the specs reason about the runner's core
      # count and its memory, and until now neither was recorded anywhere
      # a grep could reach — the "2-core CI runner" belief in
      # ui-grid.md survived a year of runs because nothing contradicted
      # it in the log.
      #
      # Every reading is defensive: the two runners share no tooling.
      # Git Bash on windows-2025 has no `/proc/meminfo`, ubuntu-24.04 has
      # no PowerShell, and `wmic` is gone from current Windows images, so
      # each fact falls back through what the seat does have and finally
      # to "unknown".
      #
      # THE STEP REPORTS; IT NEVER FAILS THE JOB -- which this step
      # claimed before it was true (gate, 2026-09-04, reproduced by both
      # reviewers). `shell: bash` on Actions is `bash --noprofile --norc
      # -e -o pipefail {0}`: the `-e` and the `-o pipefail` are the
      # runner's, not ours, and `set -u` does not switch them off. The
      # memory reading assigns from a PIPELINE whose first element is
      # `powershell`, so a powershell that exits non-zero made the
      # pipeline fail, made the assignment fail, and ended the step --
      # after the tests, the artifacts and everything else had gone
      # green. Measured with a `powershell` stub that exits 1: exit 1
      # from the step and a ZERO-BYTE summary, because the block that
      # writes the table never ran. A red at the end of a green Windows
      # job, from the one step whose entire job is to report.
      #
      # Belt and braces. `continue-on-error: true` means a failure here
      # cannot fail the job whatever happens inside. And every fact is
      # gathered by an assignment that is explicitly recovered (`|| var=""`),
      # so a missing or failing tool yields "unknown" and the table is
      # still written -- the flag is the net, the recovery is the fix.
      - name: Record the runner's environment
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u

          cpus="$(nproc 2>/dev/null)" || cpus=""
          [ -n "$cpus" ] || cpus="${NUMBER_OF_PROCESSORS:-}"
          [ -n "$cpus" ] || cpus="unknown"

          mem=""
          if [ -r /proc/meminfo ]; then
            mem="$(awk '/^MemTotal:/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo 2>/dev/null)" || mem=""
          elif command -v powershell >/dev/null 2>&1; then
            mem="$(powershell -NoProfile -Command \
              '"{0:N1} GiB" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)' \
              2>/dev/null | tr -d '\r')" || mem=""
          fi
          [ -n "$mem" ] || mem="unknown"

          disk="$(df -h 2>/dev/null)" || disk=""
          [ -n "$disk" ] || disk="df unavailable on this runner"

          rustcv="$(rustc -vV 2>/dev/null)" || rustcv=""
          [ -n "$rustcv" ] || rustcv="rustc unavailable on this runner"

          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "## Runner environment — ${{ matrix.os }}"
            echo
            echo "| fact | value |"
            echo "| --- | --- |"
            echo "| image | ${ImageOS:-unknown} ${ImageVersion:-} |"
            echo "| os / arch | ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown} |"
            echo "| cpus | $cpus |"
            echo "| memory | $mem |"
            echo "| evidence root | ${FASTCULL_EVIDENCE:-unset} |"
            echo
            echo '<details><summary>free disk at the end of the job</summary>'
            echo
            echo '```'
            echo "$disk"
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>rustc -vV</summary>'
            echo
            echo '```'
            echo "$rustcv"
            echo '```'
            echo '</details>'
          } >> "$summary" || true
