name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux GUI build dependencies (slint/winit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb

      - uses: Swatinem/rust-cache@v2

      - name: Cache sample RAWs
        uses: actions/cache@v4
        with:
          path: testdata/raws
          key: testdata-raws-v1

      - name: Fetch sample RAWs
        if: runner.os != 'Windows'
        run: testdata/fetch.sh
      - name: Fetch sample RAWs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: testdata/fetch.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Screenshot smoke tests (Linux, headless X)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --release -p fastcull-app --test screenshot
      - name: Screenshot smoke tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --release -p fastcull-app --test screenshot

      # Advisory only (user decision 2026-07-25): shared virtualized runners
      # cannot gate wall-clock budgets; enforcement happens on reference
      # hardware in every gate round (specs/01-architecture.md).
      - name: Performance budgets (release, advisory)
        continue-on-error: true
        run: cargo test --release -p fastcull-core --test perf_budgets
